[project]
name = "salon-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for salon supervisor"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.32.0",
    "firebase-admin>=6.4.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

